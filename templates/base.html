<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}{{ subject or "Notification" }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#0b1220;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr>
      <td align="center">
        <!-- container -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e8edf2;">
          <tr>
            <td style="padding:20px 28px;background:#ffffff;">
              <!-- header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-weight:700;color:#111827;font-size:18px;">
                    {{ company_name or "Your Company" }}
                  </td>
                  <td align="right" style="font-size:12px;color:#6b7280;">
                    {{ current_year or "" }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 28px;">
              {% block main %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:18px 28px;background:#fbfdff;border-top:1px solid #f1f5f9;font-size:12px;color:#6b7280;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    If you need help, contact <a href="mailto:{{ support_email or 'support@example.com' }}" style="color:#2563eb;text-decoration:none;">{{ support_email or 'support@example.com' }}</a>.
                  </td>
                  <td align="right">
                    <a href="{{ home_url or '#' }}" style="color:#6b7280;text-decoration:none;">Visit site</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /container -->
      </td>
    </tr>
  </table>
</body>
</html>
