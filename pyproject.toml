[project]
name = "APIHealthChecker"
version = "0.1.0"
requires-python = ">=3.12"

[[tool.poetry.packages]]
include = "app"

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = {version = ">=0.118,<1"}
uvicorn = {version = ">=0.30", extras = ["standard"]}
httpx = ">=0.27"
pydantic = {version = ">=2,<3"}
pydantic-settings = {version = ">=2,<3"}
sqlalchemy = {version = ">=2.0", extras = ["asyncio"]}
asyncpg = ">=0.29"
alembic = ">=1.13"
email-validator = "<2.3"
python-jose = {version = ">=3.3", extras = ["cryptography"]}
passlib = {version = ">=1.7", extras = ["argon2"]}
python-multipart = ">=0.0.6"
fastapi-users = {version = "==14.0.1", extras = ["sqlalchemy"]}
fastapi-mail = {version = ">=1.5.2", python = ">=3.12,<4.0.0"}
[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)"
]
